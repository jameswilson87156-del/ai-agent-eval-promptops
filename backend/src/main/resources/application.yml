server:
  port: 18080

spring:
  application:
    name: ai-agent-eval-promptops-console
  datasource:
    url: ${PROMPTOPS_DB_URL:jdbc:mysql://127.0.0.1:3306/ai_agent_eval_promptops?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${PROMPTOPS_DB_USER:root}
    password: ${PROMPTOPS_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: ${PROMPTOPS_SQL_INIT:always}
      encoding: UTF-8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

promptops:
  demo-data:
    enabled: ${PROMPTOPS_DEMO_DATA:true}
  provider:
    base-url: ${PROMPTOPS_PROVIDER_BASE_URL:https://api.openai.com/v1}
    model-name: ${PROMPTOPS_PROVIDER_MODEL:}
    api-key: ${PROMPTOPS_PROVIDER_API_KEY:${OPENAI_API_KEY:}}
    config-version: ${PROMPTOPS_PROVIDER_CONFIG_VERSION:provider-config-v1}
    timeout-seconds: ${PROMPTOPS_PROVIDER_TIMEOUT_SECONDS:30}
    max-retries: ${PROMPTOPS_PROVIDER_MAX_RETRIES:2}
    max-tool-rounds: ${PROMPTOPS_PROVIDER_MAX_TOOL_ROUNDS:2}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
