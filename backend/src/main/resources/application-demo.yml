spring:
  datasource:
    url: ${PROMPTOPS_DB_URL:jdbc:h2:file:./agent-eval-demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      encoding: UTF-8

promptops:
  demo-data:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
